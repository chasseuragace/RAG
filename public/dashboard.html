<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Server — Console</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --faint: #9ca3af;
            --border: #e5e7eb;
            --border-strong: #d1d5db;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --success: #047857;
            --success-bg: #ecfdf5;
            --danger: #b91c1c;
            --danger-bg: #fef2f2;
            --warn: #b45309;
            --info: #1d4ed8;
            --info-bg: #eff6ff;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .app-header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
        .app-header__inner { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .app-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
        .app-title span { color: var(--muted); font-weight: 400; margin-left: 8px; }
        .status { display: flex; gap: 16px; }
        .status__item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
        .dot--on { background: #10b981; }
        .dot--off { background: #ef4444; }
        .dot--warn { background: #f59e0b; }

        /* Layout */
        .container { max-width: 1280px; margin: 0 auto; padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 14px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
        .card__head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); }
        .card__title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
        .card__body { padding: 14px; }
        .grid-2 { display: grid; grid-template-columns: 340px 1fr; gap: 14px; align-items: start; }
        @media (max-width: 880px) { .grid-2 { grid-template-columns: 1fr; } }

        /* Toolbar */
        .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .toolbar__label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); margin-right: 2px; }
        .toolbar__sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
        .btn { font-size: 13px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: #374151; cursor: pointer; font-weight: 500; transition: background 0.15s, border-color 0.15s; white-space: nowrap; }
        .btn:hover { background: #f9fafb; }
        .btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn--primary:hover { background: var(--accent-hover); }
        .btn--danger { border-color: #fecaca; color: var(--danger); background: var(--surface); }
        .btn--danger:hover { background: var(--danger-bg); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .input { font-size: 13px; padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); font-family: inherit; }
        .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
        .input--grow { flex: 1; min-width: 160px; }
        .input--session { width: 150px; }

        /* Notice banner */
        .notice { padding: 9px 12px; border-radius: 6px; font-size: 13px; border: 1px solid transparent; display: flex; gap: 8px; align-items: baseline; }
        .notice__tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .notice--success { background: var(--success-bg); border-color: #a7f3d0; color: var(--success); }
        .notice--error { background: var(--danger-bg); border-color: #fecaca; color: var(--danger); }
        .notice--info { background: var(--info-bg); border-color: #bfdbfe; color: var(--info); }

        /* Metrics strip */
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
        .metric { padding: 4px 16px; border-left: 1px solid var(--border); }
        .metric:first-child { border-left: none; padding-left: 0; }
        .metric__label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
        .metric__value { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }

        /* Key-value (store stats) */
        .kv__row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); }
        .kv__row:last-child { border-bottom: none; }
        .kv__key { color: var(--muted); }
        .kv__val { font-weight: 600; font-variant-numeric: tabular-nums; }
        .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #f3f4f6; color: #374151; text-transform: capitalize; }
        .pill--ok { background: var(--success-bg); color: var(--success); }

        /* Events */
        .events { max-height: 460px; overflow-y: auto; display: flex; flex-direction: column; }
        .event { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .event:last-child { border-bottom: none; }
        .event:hover { background: #f9fafb; }
        .event--selected { background: #f3f4f6; }
        .event__bar { width: 3px; align-self: stretch; border-radius: 2px; flex: none; }
        .event__type { font-family: var(--mono); font-size: 11px; font-weight: 600; min-width: 150px; }
        .event__time { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 64px; }
        .event__preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-family: var(--mono); }
        .event__idx { font-size: 11px; color: var(--faint); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
        .code { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; font-size: 12px; font-family: var(--mono); overflow-x: auto; max-height: 320px; white-space: pre; }

        /* Answer */
        .answer__q { font-weight: 600; margin-bottom: 6px; }
        .answer__a { white-space: pre-wrap; border-left: 2px solid var(--accent); padding-left: 12px; }
        .answer__src { margin-top: 10px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
        /* Tabs */
        .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding: 0 24px; background: var(--surface); }
        .tab { font-size: 12px; font-weight: 500; padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); transition: color 0.15s, border-color 0.15s; }
        .tab:hover { color: var(--text); }
        .tab--active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab--expert { color: var(--warn); }
        .tab--expert.tab--active { color: var(--warn); border-bottom-color: var(--warn); }

        /* Expert mode panel */
        .expert-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 4px; background: #fef3c7; color: var(--warn); border: 1px solid #fde68a; }
        .field-group { display: flex; flex-direction: column; gap: 14px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field__label { font-size: 12px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
        .field__required { font-size: 10px; color: var(--danger); font-weight: 700; }
        .field__hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
        .field__hint strong { color: var(--text); font-weight: 600; }
        .input--full { width: 100%; }
        .textarea { font-size: 13px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); font-family: inherit; resize: vertical; min-height: 72px; }
        .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
        .select { font-size: 13px; padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; }
        .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
        .grid-expert { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 640px) { .grid-expert { grid-template-columns: 1fr; } }
        .fixture-result { background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
        .fixture-result__row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
        .fixture-result__row:last-child { border-bottom: none; }
        .fixture-result__key { color: var(--muted); }
        .fixture-result__val { font-weight: 600; font-family: var(--mono); font-size: 11px; }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    const { useState, useEffect, useRef } = React;
    const h = React.createElement;

    // ─── field helper ───────────────────────────────────────────────────────
    const field = (label, required, hint, input) =>
      h('div', { className: 'field' },
        h('label', { className: 'field__label' },
          label,
          required && h('span', { className: 'field__required' }, ' required')
        ),
        h('div', { className: 'field__hint', dangerouslySetInnerHTML: { __html: hint } }),
        input
      );

    // ─── CaptureFixturePanel ────────────────────────────────────────────────
    const CaptureFixturePanel = ({ sendWS }) => {
      const empty = { id: '', description: '', query: '', topK: '3', expectedAction: 'answer', humanJudgment: '', tags: '', captureChunks: false };
      const [form, setForm] = useState(empty);
      const [status, setStatus] = useState(null);
      const [saving, setSaving] = useState(false);
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const handleCapture = () => {
        if (!form.id.trim())            return setStatus({ kind: 'error', text: 'ID is required.' });
        if (!form.query.trim())         return setStatus({ kind: 'error', text: 'Query is required.' });
        if (!form.humanJudgment.trim()) return setStatus({ kind: 'error', text: 'Human judgment is required.' });
        setSaving(true); setStatus(null);
        sendWS({
          type: 'request:capture-fixture',
          id: form.id.trim(), description: form.description.trim(),
          query: form.query.trim(), topK: parseInt(form.topK) || 3,
          expectedAction: form.expectedAction, humanJudgment: form.humanJudgment.trim(),
          tags: form.tags.split(',').map(t => t.trim()).filter(Boolean),
          captureChunks: form.captureChunks,
        });
      };

      useEffect(() => {
        const handler = (e) => {
          setSaving(false);
          if (e.detail.success) { setStatus({ kind: 'success', text: `Fixture "${e.detail.fixture.id}" saved.`, fixture: e.detail.fixture }); setForm(empty); }
          else setStatus({ kind: 'error', text: e.detail.error });
        };
        window.addEventListener('capture-fixture:result', handler);
        return () => window.removeEventListener('capture-fixture:result', handler);
      }, []);

      return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '20px' } },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
          h('span', { className: 'expert-badge' }, 'Expert Mode'),
          h('span', { style: { fontSize: '13px', color: 'var(--muted)' } },
            'Run a query, review results, save your judgment as a golden fixture. ',
            h('a', { href: 'https://github.com', target: '_blank', style: { color: 'var(--accent)' } }, 'Read the guide →')
          )
        ),
        h('div', { className: 'notice notice--info' },
          h('div', null,
            h('strong', null, 'How this works: '),
            'Fill in the fields and click Capture. The system runs your query through the live pipeline, records the real assessment values, and saves your expected action + judgment in ',
            h('code', { style: { fontFamily: 'var(--mono)', fontSize: '12px' } }, 'data/golden-decisions.json'),
            '. Run the Replay Harness later to verify a new policy still matches your judgments.'
          )
        ),
        h('div', { className: 'field-group' },
          h('div', { className: 'grid-expert' },
            field('Fixture ID', true,
              'Stable kebab-case identifier. <strong>Never reuse a deleted ID.</strong> Example: <code style="font-family:var(--mono)">parang-rabbit-name</code>',
              h('input', { className: 'input input--full', placeholder: 'e.g. parang-rabbit-name', value: form.id, onChange: e => set('id', e.target.value) })
            ),
            field('Description', false,
              'One sentence describing what this fixture tests. Used as a label in reports.',
              h('input', { className: 'input input--full', placeholder: 'e.g. Direct question — answer is in the text', value: form.description, onChange: e => set('description', e.target.value) })
            )
          ),
          field('Query', true,
            'The exact query to run. The pipeline retrieves chunks for this and computes the assessment. <strong>Use a real user query, not a test string.</strong>',
            h('input', { className: 'input input--full', placeholder: 'e.g. what did Parang name the rabbit', value: form.query, onChange: e => set('query', e.target.value) })
          ),
          h('div', { className: 'grid-expert' },
            field('Top K', false,
              'Number of chunks to retrieve. Default 3 is usually enough.',
              h('input', { className: 'input input--full', type: 'number', min: '1', max: '20', value: form.topK, onChange: e => set('topK', e.target.value) })
            ),
            field('Expected Action', true,
              '<strong>Your gold label.</strong> What the policy should decide given these results. Set this after reviewing the retrieved chunks — not based on any heuristic.',
              h('select', { className: 'select', style: { width: '100%' }, value: form.expectedAction, onChange: e => set('expectedAction', e.target.value) },
                h('option', { value: 'answer' },        'answer — results are sufficient'),
                h('option', { value: 'increase_topk' }, 'increase_topk — need more chunks'),
                h('option', { value: 'rewrite_query' }, 'rewrite_query — query is vague/ambiguous'),
                h('option', { value: 'stop' },          'stop — information not in corpus')
              )
            )
          ),
          field('Human Judgment', true,
            '<strong>Why</strong> you chose that expected action. The most important field — without it the fixture is unauditable. Example: "Chunk with \'Well, Bingo.\' directly answers the question."',
            h('textarea', { className: 'textarea input--full', placeholder: 'Explain why the expected action is correct given the retrieved chunks…', value: form.humanJudgment, onChange: e => set('humanJudgment', e.target.value) })
          ),
          field('Tags', false,
            'Comma-separated labels. Suggested: <code style="font-family:var(--mono)">domain:story</code>, <code style="font-family:var(--mono)">query-type:factual</code>, <code style="font-family:var(--mono)">query-type:ambiguous</code>, <code style="font-family:var(--mono)">query-type:out-of-domain</code>. <code style="font-family:var(--mono)">captured-with:mock</code> and <code style="font-family:var(--mono)">verified-by:human</code> are added automatically.',
            h('input', { className: 'input input--full', placeholder: 'domain:story, query-type:factual', value: form.tags, onChange: e => set('tags', e.target.value) })
          ),
          h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
            h('input', { type: 'checkbox', id: 'captureChunks', checked: form.captureChunks, onChange: e => set('captureChunks', e.target.checked) }),
            h('label', { htmlFor: 'captureChunks', style: { fontSize: '13px' } }, 'Snapshot retrieved chunks'),
            h('span', { style: { fontSize: '12px', color: 'var(--muted)' } }, '— saves chunk IDs and content in the fixture for auditing')
          )
        ),
        h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } },
          h('button', { className: 'btn btn--primary', onClick: handleCapture, disabled: saving }, saving ? 'Running pipeline…' : 'Capture Fixture'),
          h('button', { className: 'btn', onClick: () => { setForm(empty); setStatus(null); } }, 'Clear'),
          status && h('span', { style: { fontSize: '12px', color: status.kind === 'error' ? 'var(--danger)' : 'var(--success)' } }, status.text)
        ),
        status && status.kind === 'success' && status.fixture && h('div', null,
          h('div', { style: { fontSize: '12px', fontWeight: '600', color: 'var(--muted)', marginBottom: '6px' } }, 'Saved fixture'),
          h('div', { className: 'fixture-result' },
            ...[
              ['id', status.fixture.id],
              ['query', status.fixture.sourceQuery],
              ['expectedAction', status.fixture.expectedAction],
              ['quality', status.fixture.assessment?.quality?.toFixed(3)],
              ['completeness', status.fixture.assessment?.completeness?.toFixed(3)],
              ['capturedWith', status.fixture.capturedWith],
              ['tags', (status.fixture.tags || []).join(', ')],
            ].map(([k, v]) => h('div', { className: 'fixture-result__row', key: k },
              h('span', { className: 'fixture-result__key' }, k),
              h('span', { className: 'fixture-result__val' }, v)
            ))
          )
        )
      );
    };

    const Dashboard = () => {
        const [activeTab, setActiveTab] = useState('console');
        const [expertMode, setExpertMode] = useState(false);
        const [metrics, setMetrics] = useState(null);
        const [events, setEvents] = useState([]);
        const [connected, setConnected] = useState(false);
        const [wsConnected, setWsConnected] = useState(false);
        const [serverStats, setServerStats] = useState(null);
        const [selectedEvent, setSelectedEvent] = useState(null);
        const [lastAnswer, setLastAnswer] = useState(null);
        const [notice, setNotice] = useState(null);
        const [query, setQuery] = useState('');
        const [sessionId, setSessionId] = useState('');
        const wsRef = useRef(null);

        const getHost = () => window.location.hostname;
        const getPort = () => window.location.port || 3000;

        useEffect(() => {
            fetch(`http://${window.location.hostname}:${window.location.port || 3000}/health`)
              .then(r => r.json()).then(d => { if (d.expertMode) setExpertMode(true); }).catch(() => {});
            connectWebSocket();
            const metricsInterval = setInterval(() => {
                if (wsRef.current && wsRef.current.readyState === 1) {
                    sendWS({ type: 'request:metrics' });
                    sendWS({ type: 'request:stats' });
                } else {
                    fetchMetricsHttp();
                    fetchStatsHttp();
                }
            }, 2000);
            return () => { clearInterval(metricsInterval); if (wsRef.current) wsRef.current.close(); };
        }, []);

        const connectWebSocket = () => {
            const ws = new WebSocket(`ws://${getHost()}:${getPort()}`);
            wsRef.current = ws;
            ws.onopen = () => {
                setWsConnected(true); setConnected(true);
                sendWS({ type: 'request:metrics' });
                sendWS({ type: 'request:stats' });
                sendWS({ type: 'request:event-log' });
            };
            ws.onmessage = (event) => {
                try { handleWSMessage(JSON.parse(event.data)); } catch(e) { console.error('WS parse error', e); }
            };
            ws.onclose = () => setWsConnected(false);
            ws.onerror = () => setWsConnected(false);
        };

        const sendWS = (payload) => {
            if (wsRef.current && wsRef.current.readyState === 1) wsRef.current.send(JSON.stringify(payload));
            else setNotice({ kind: 'error', text: 'WebSocket not connected.' });
        };

        const handleWSMessage = (msg) => {
            switch (msg.type) {
                case 'connection:established':
                    setMetrics(msg.data.metrics); setEvents(msg.data.recentEvents || []); break;
                case 'event':
                    setEvents(prev => { const u = [...prev, msg.data]; if (u.length > 200) u.shift(); return u; }); break;
                case 'metrics': setMetrics(msg.data); setConnected(true); break;
                case 'stats': setServerStats(msg.data); break;
                case 'event-log': setEvents(msg.data); break;
                case 'capture-fixture:result':
                    window.dispatchEvent(new CustomEvent('capture-fixture:result', { detail: msg.data })); break;
                case 'inject:result': {
                    const d = msg.data;
                    if (!d.success) { setNotice({ kind: 'error', text: `Injection failed: ${d.error}` }); break; }
                    if (d.mode === 'incremental') {
                        setNotice({ kind: 'success', text: `Incremental sync complete in ${d.duration} — added ${d.added}, changed ${d.changed}, unchanged ${d.unchanged}, removed ${d.removed} (chunks restored: ${d.chunksStored}).` });
                    } else {
                        setNotice({ kind: 'success', text: `Full rebuild complete in ${d.duration} — ${d.documentsProcessed} docs, ${d.chunksStored} chunks stored.` });
                    }
                    break;
                }
                case 'retrieve:result':
                    setNotice({ kind: 'info', text: `Retrieved ${msg.data.resultsCount} chunk(s) in ${msg.data.duration}. Top match: ${msg.data.results?.[0]?.id || '—'}` }); break;
                case 'ask:result':
                    setLastAnswer(msg.data); setNotice({ kind: 'success', text: `Answer ready for session "${msg.data.sessionId || 'anon'}".` }); break;
                case 'clear:result':
                    setNotice({ kind: 'info', text: 'Vector store cleared.' }); break;
                case 'error':
                    setNotice({ kind: 'error', text: msg.data.message }); break;
                default: break;
            }
        };

        const fetchMetricsHttp = async () => {
            try {
                const res = await fetch(`http://${getHost()}:${getPort()}/metrics`);
                if (res.ok) { setMetrics(await res.json()); setConnected(true); } else setConnected(false);
            } catch(e) { setConnected(false); }
        };
        const fetchStatsHttp = async () => {
            try { const res = await fetch(`http://${getHost()}:${getPort()}/stats`); if (res.ok) setServerStats(await res.json()); } catch(e) {}
        };

        const handleIncremental = () => sendWS({ type: 'request:inject-incremental' });
        const handleInject = () => {
            if (confirm('Full rebuild clears the entire vector store and re-embeds every file in ./input. Use Incremental Sync for routine updates. Continue?'))
                sendWS({ type: 'request:inject' });
        };
        const handleClear = () => { if (confirm('Clear the vector store without re-injecting?')) sendWS({ type: 'request:clear' }); };
        const handleRetrieve = () => { if (query.trim()) sendWS({ type: 'request:retrieve', query: query.trim(), topK: 5 }); };
        const handleAsk = () => { if (query.trim()) sendWS({ type: 'request:ask', query: query.trim(), sessionId: sessionId.trim() || undefined, topK: 3 }); };

        const getEventColor = (type) => {
            if (type.includes('error')) return '#ef4444';
            if (type.includes('complete') || type.includes('stored')) return '#10b981';
            if (type.includes('start') || type.includes('diff')) return '#4f46e5';
            if (type.includes('queried') || type.includes('retrieved')) return '#f59e0b';
            if (type.includes('embedding')) return '#8b5cf6';
            return '#9ca3af';
        };

        const metric = (label, value) => h('div', { className: 'metric' },
            h('div', { className: 'metric__label' }, label),
            h('div', { className: 'metric__value' }, value)
        );
        const kvRow = (key, val, pill) => h('div', { className: 'kv__row' },
            h('span', { className: 'kv__key' }, key),
            pill ? h('span', { className: `pill ${val === 'ready' ? 'pill--ok' : ''}` }, val) : h('span', { className: 'kv__val' }, val)
        );

        return h('div', null,
            // Header
            h('header', { className: 'app-header' },
                h('div', { className: 'app-header__inner' },
                    h('div', { className: 'app-title' }, 'RAG Server', h('span', null, 'Console')),
                    h('div', { className: 'status' },
                        expertMode && h('div', { className: 'status__item' }, h('span', { className: 'expert-badge' }, 'Expert Mode')),
                        h('div', { className: 'status__item' }, h('span', { className: `dot ${connected ? 'dot--on' : 'dot--off'}` }), connected ? 'HTTP' : 'HTTP offline'),
                        h('div', { className: 'status__item' }, h('span', { className: `dot ${wsConnected ? 'dot--on' : 'dot--warn'}` }), wsConnected ? 'WebSocket' : 'WS offline')
                    )
                )
            ),
            // Tabs
            h('div', { className: 'tabs' },
                h('div', { className: `tab ${activeTab === 'console' ? 'tab--active' : ''}`, onClick: () => setActiveTab('console') }, 'Console'),
                expertMode && h('div', { className: `tab tab--expert ${activeTab === 'expert' ? 'tab--active' : ''}`, onClick: () => setActiveTab('expert') }, 'Capture Fixture')
            ),
            // Console tab
            activeTab === 'console' && h('div', { className: 'container' },

                // Controls
                h('div', { className: 'card' },
                    h('div', { className: 'card__head' }, h('span', { className: 'card__title' }, 'Controls')),
                    h('div', { className: 'card__body', style: { display: 'flex', flexDirection: 'column', gap: '12px' } },
                        h('div', { className: 'toolbar' },
                            h('span', { className: 'toolbar__label' }, 'Index'),
                            h('button', { className: 'btn btn--primary', onClick: handleIncremental, title: 'Re-embed only changed files (hash diff). No clear; retrieval stays live.' }, 'Incremental Sync'),
                            h('button', { className: 'btn', onClick: handleInject, title: 'Clear everything and re-embed the whole ./input corpus.' }, 'Full Rebuild'),
                            h('div', { className: 'toolbar__sep' }),
                            h('button', { className: 'btn btn--danger', onClick: handleClear }, 'Clear Store')
                        ),
                        h('div', { className: 'toolbar' },
                            h('span', { className: 'toolbar__label' }, 'Query'),
                            h('input', { className: 'input input--grow', placeholder: 'Enter a query…', value: query,
                                onChange: e => setQuery(e.target.value), onKeyDown: e => { if (e.key === 'Enter') handleRetrieve(); } }),
                            h('input', { className: 'input input--session', placeholder: 'session id (optional)', value: sessionId,
                                onChange: e => setSessionId(e.target.value) }),
                            h('button', { className: 'btn', onClick: handleRetrieve, disabled: !query.trim() }, 'Retrieve'),
                            h('button', { className: 'btn btn--primary', onClick: handleAsk, disabled: !query.trim() }, 'Ask')
                        ),
                        notice && h('div', { className: `notice notice--${notice.kind}` },
                            h('span', { className: 'notice__tag' }, notice.kind),
                            h('span', null, notice.text)
                        )
                    )
                ),

                // Metrics
                h('div', { className: 'card' },
                    h('div', { className: 'card__head' }, h('span', { className: 'card__title' }, 'Server Metrics')),
                    h('div', { className: 'card__body' },
                        metrics ? h('div', { className: 'metrics' },
                            metric('Uptime', metrics.uptimeFormatted),
                            metric('Requests', metrics.requestsTotal),
                            metric('Injections', metrics.injectionTotal),
                            metric('Retrievals', metrics.retrievalTotal),
                            metric('Embeddings', metrics.embeddingsTotal),
                            metric('Clients', metrics.connectedClients)
                        ) : h('div', { className: 'empty' }, 'Loading metrics…')
                    )
                ),

                // Two column: store + answer | events
                h('div', { className: 'grid-2' },
                    h('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } },
                        h('div', { className: 'card' },
                            h('div', { className: 'card__head' }, h('span', { className: 'card__title' }, 'Vector Store')),
                            h('div', { className: 'card__body' },
                                serverStats ? h('div', null,
                                    kvRow('Documents', serverStats.totalDocuments ?? 0),
                                    kvRow('Queries', serverStats.queryCount ?? 0),
                                    kvRow('Status', serverStats.status || 'ready', true)
                                ) : h('div', { className: 'empty' }, 'Loading…')
                            )
                        ),
                        lastAnswer && h('div', { className: 'card' },
                            h('div', { className: 'card__head' }, h('span', { className: 'card__title' }, 'Last Answer')),
                            h('div', { className: 'card__body answer' },
                                h('div', { className: 'answer__q' }, lastAnswer.query, h('span', { className: 'muted' }, `  ·  session: ${lastAnswer.sessionId || 'anon'}`)),
                                h('div', { className: 'answer__a' }, lastAnswer.answer),
                                h('div', { className: 'answer__src' }, `sources: ${lastAnswer.sources?.map(s => s.id).join(', ') || 'none'}`)
                            )
                        )
                    ),

                    h('div', { className: 'card' },
                        h('div', { className: 'card__head' },
                            h('span', { className: 'card__title' }, `Events · ${events.length}`),
                            h('button', { className: 'btn', onClick: () => sendWS({ type: 'request:event-log' }) }, 'Refresh')
                        ),
                        h('div', { className: 'events' },
                            events.length === 0 ? h('div', { className: 'empty' }, 'Waiting for events…') :
                                events.slice().reverse().map((event, ri) => {
                                    const idx = events.length - 1 - ri;
                                    const time = new Date(event.timestamp).toLocaleTimeString();
                                    const color = getEventColor(event.type);
                                    const preview = event.data && Object.keys(event.data).length
                                        ? JSON.stringify(event.data).replace(/[{}"]/g, '').slice(0, 80) : '';
                                    return h('div', {
                                        key: idx,
                                        className: `event ${selectedEvent === idx ? 'event--selected' : ''}`,
                                        onClick: () => setSelectedEvent(selectedEvent === idx ? null : idx)
                                    },
                                        h('span', { className: 'event__bar', style: { background: color } }),
                                        h('span', { className: 'event__type', style: { color } }, event.type),
                                        h('span', { className: 'event__time' }, time),
                                        h('span', { className: 'event__preview' }, preview),
                                        h('span', { className: 'event__idx' }, idx + 1)
                                    );
                                })
                        ),
                        selectedEvent !== null && events[selectedEvent] &&
                            h('div', { className: 'card__body', style: { borderTop: '1px solid var(--border)' } },
                                h('pre', { className: 'code' }, JSON.stringify(events[selectedEvent], null, 2))
                            )
                    )
                )
            ), // end console tab
            // Expert tab
            activeTab === 'expert' && expertMode && h('div', { className: 'container' },
                h('div', { className: 'card' },
                    h('div', { className: 'card__head' }, h('span', { className: 'card__title' }, 'Capture Fixture')),
                    h('div', { className: 'card__body' },
                        h(CaptureFixturePanel, { sendWS })
                    )
                )
            )
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(h(Dashboard));
</script>
</body>
</html>
