services:
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chroma-db
    ports:
      - "8000:8000"
    environment:
      - ALLOW_RESET=true
    volumes:
      - chroma-data:/chroma/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5.26.0
    container_name: neo4j-db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
      # CRITICAL: Must be a valid JSON array with double quotes. Single quotes will be parsed
      # as a string literal by YAML and silently ignored by Neo4j.
      # Also requires container recreate (not restart) to take effect:
      #   docker compose down neo4j && docker compose up -d neo4j
      - NEO4J_PLUGINS=["apoc"]
      # Allow all apoc.* procedures without needing a manual docker exec step.
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_password", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    # ParadeDB image = postgres:16 + pg_search (BM25 via Tantivy) pre-installed.
    # pg_search requires shared_preload_libraries — set via POSTGRES_INITDB_ARGS
    # or via the command override below.
    # Pinned to 0.19.11-pg16: the latest pg16 release with a stable pg_search build.
    # To upgrade: change the tag; the postgres-data volume is preserved across swaps.
    image: paradedb/paradedb:0.19.11-pg16
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_password
      - POSTGRES_DB=rag_system
    command: >
      postgres
      -c shared_preload_libraries=pg_search
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_system"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  chroma-data:
  neo4j-data:
  neo4j-logs:
  postgres-data:
